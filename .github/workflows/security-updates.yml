name: Security Updates

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          plugins: poetry-plugin-export

      - name: Install all dependencies (including extras)
        run: poetry install --all-extras --no-interaction

      - name: Install pip-audit into Poetry virtualenv
        run: poetry run pip install pip-audit

      - name: Run pip-audit and capture JSON
        run: |
          poetry run pip-audit --format json --output /tmp/audit-report.json || true

      - name: Parse audit results
        id: parse
        run: |
          python3 - <<'PYEOF'
          import json, os

          with open("/tmp/audit-report.json") as f:
              data = json.load(f)

          packages = data if isinstance(data, list) else data.get("dependencies", [])
          vulnerable = [pkg["name"] for pkg in packages if pkg.get("vulns")]

          if not vulnerable:
              print("No vulnerabilities found.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("has_vulns=false\n")
          else:
              print(f"Vulnerable packages: {', '.join(vulnerable)}")
              with open("/tmp/vulnerable_packages.txt", "w") as f:
                  f.write("\n".join(vulnerable) + "\n")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("has_vulns=true\n")
          PYEOF

      - name: Update vulnerable packages in poetry.lock
        if: steps.parse.outputs.has_vulns == 'true'
        run: |
          while IFS= read -r pkg; do
            [[ -z "$pkg" ]] && continue
            echo "--- Updating: $pkg ---"
            poetry update "$pkg" --no-interaction
          done < /tmp/vulnerable_packages.txt

      - name: Regenerate requirements.txt
        if: steps.parse.outputs.has_vulns == 'true'
        run: |
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Build commit message
        if: steps.parse.outputs.has_vulns == 'true'
        run: |
          pkgs=$(paste -sd ', ' /tmp/vulnerable_packages.txt)
          {
            echo "COMMIT_MSG<<COMMIT_MSG_DELIM"
            echo "chore(security): update vulnerable packages [$pkgs]"
            echo ""
            echo "Packages updated by pip-audit security scan:"
            while IFS= read -r pkg; do
              [[ -z "$pkg" ]] && continue
              echo "  - $pkg"
            done < /tmp/vulnerable_packages.txt
            echo "COMMIT_MSG_DELIM"
          } >> "$GITHUB_ENV"

      - name: Commit and push to main
        if: steps.parse.outputs.has_vulns == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add poetry.lock requirements.txt
          if git diff --cached --quiet; then
            echo "poetry.lock unchanged (fix version may be outside semver constraints) - nothing to commit."
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push origin main
